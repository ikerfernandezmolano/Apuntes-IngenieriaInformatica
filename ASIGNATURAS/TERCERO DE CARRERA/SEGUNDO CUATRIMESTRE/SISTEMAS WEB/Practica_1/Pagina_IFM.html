<html>
<head>
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <script type="text/javascript">
    google.charts.load('current', {'packages':['corechart']});
    google.charts.setOnLoadCallback(loadData);

    function loadData() {

      var xhttp = new XMLHttpRequest();
      var uri = "https://api.thingspeak.com/channels/3270528/feeds.json?api_key=J8V12UW1PUWXEEZR";

      xhttp.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {

          var responseData = JSON.parse(this.responseText);
          drawChart(responseData.feeds);
        }
      };

      xhttp.open("GET", uri, true); // true = asíncrono
      xhttp.send();
    }

    function drawChart(feeds) {

      var data = new google.visualization.DataTable();

      // Definir columnas
      data.addColumn('string', 'Fecha');
      data.addColumn('number', '%CPU');
      data.addColumn('number', '%RAM');

      // Añadir filas dinámicamente
      for (var i = 0; i < feeds.length; i++) {

        var fecha = feeds[i].created_at;
        var cpu = parseFloat(feeds[i].field1);
        var ram = parseFloat(feeds[i].field2);

        if (!isNaN(cpu) && !isNaN(ram)) {
          data.addRow([fecha, cpu, ram]);
        }
      }
	  // OPCIONES DE VISUALIZACIÓN: EJE DE ORDENADAS PARA CADA VARIABLE             
	  var options = {               
		title: 'Computer performance', 
		legend: {position: 'bottom'},               
		curveType: 'function', colors: ['red', 'blue'],               
		series: {0: {targetAxisIndex: 0}, 1: {targetAxisIndex: 1}},               
		vAxes: {0: {title: '%CPU'}, 1: {title: '%RAM'}}             
	  }; 

      var chart = new google.visualization.LineChart(
        document.getElementById('curve_chart')
      );

      chart.draw(data, options);
    }
  </script>
</head>
<body>
  <div id="curve_chart" style="width: 900px; height: 500px"></div>
</body>
</html>
